# AeroSpace config
# cmd + 숫자  = 워크스페이스 전환
# alt + 숫자  = 포커스된 창을 그 워크스페이스로 보내기

after-login-command = []
after-startup-command = []
start-at-login = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]

# --- 워크스페이스 전환 (cmd) ---
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-tab = 'workspace-back-and-forth'

# --- 창을 워크스페이스로 보내기 (alt) ---
alt-1 = 'move-node-to-workspace 1'
alt-2 = 'move-node-to-workspace 2'
alt-3 = 'move-node-to-workspace 3'
alt-4 = 'move-node-to-workspace 4'
alt-5 = 'move-node-to-workspace 5'
alt-6 = 'move-node-to-workspace 6'
alt-7 = 'move-node-to-workspace 7'
alt-8 = 'move-node-to-workspace 8'
alt-9 = 'move-node-to-workspace 9'

# --- 포커스 이동: cmd + 방향키 ---
cmd-left = 'focus left'
cmd-down = 'focus down'
cmd-up = 'focus up'
cmd-right = 'focus right'

# --- 포커스 이동: ctrl + 방향키 (스페이스 옆 키용) ---
ctrl-left = 'focus left'
ctrl-down = 'focus down'
ctrl-up = 'focus up'
ctrl-right = 'focus right'

# --- 창 이동: alt + 방향키 ---
alt-left = 'move left'
alt-down = 'move down'
alt-up = 'move up'
alt-right = 'move right'

# --- vim 스타일 (기존 유지) ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- 레이아웃 / 리사이즈 ---
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# --- 모니터 간 이동 ---
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- 서비스 모드 진입 ---
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
